name: "CI Checks"
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      # Toolchain (channel + rustfmt/clippy) is pinned via rust-toolchain.toml
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: Rustfmt Check
        uses: actions-rust-lang/rustfmt@4066006ec54a31931b9b1fddfd38f2fdf2d27143 # v1

      - name: Run Clippy
        env:
          RUSTFLAGS: "-Dwarnings"
        run: cargo clippy

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - run: cargo test --all-features
        env:
          S3_ACCESS_KEY: some-access-key
          S3_SECRET_KEY: some-secret-key
          S3_REGION: eu-central-1
          S3_BUCKET_NAME: turbo
          S3_ENDPOINT: "http://localhost:9000"
