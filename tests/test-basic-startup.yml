name: Test basic startup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start Turbo Cache Server
        id: action
        uses: .
        continue-on-error: true
        env:
          PORT: "8585"
          S3_BUCKET_NAME: "test-bucket"
          S3_REGION: "us-east-1"
          S3_ACCESS_KEY: "test-access-key"
          S3_SECRET_KEY: "test-secret-key"
          S3_ENDPOINT: "http://127.0.0.1:19999"
          S3_USE_PATH_STYLE: "true"
          OTEL_SDK_DISABLED: "true"

      - name: Assert server started or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: server started successfully"
            # Verify the health endpoint is reachable
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8585/management/health || echo "000")
            echo "health check HTTP status: $HTTP_STATUS"
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "PASS: health check returned 200"
            else
              echo "INFO: health check returned $HTTP_STATUS (server may have started but S3 not reachable)"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: server failed gracefully (expected without real S3 backend)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
