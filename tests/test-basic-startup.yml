name: Test basic startup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start Turbo Cache Server
        id: action
        uses: .
        continue-on-error: true
        env:
          PORT: "8585"
          S3_BUCKET_NAME: "test-bucket"
          S3_REGION: "us-east-1"
          S3_ACCESS_KEY: "fake-access-key"
          S3_SECRET_KEY: "fake-secret-key"
          S3_ENDPOINT: "http://127.0.0.1:19999"
          OTEL_SDK_DISABLED: "true"

      - name: Assert server started or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The server may succeed (health check passes) or fail (S3 not reachable at startup)
          # Either way, the action should not crash unexpectedly
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: server started successfully"
            # Verify health endpoint is reachable
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8585/management/health || echo "000")
            echo "health endpoint status: $HTTP_STATUS"
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "PASS: health endpoint returned 200"
            else
              echo "INFO: health endpoint returned $HTTP_STATUS (server may have exited after startup)"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected when S3 is not available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
