name: Test basic startup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start Turbo Cache Server
        id: action
        uses: .
        env:
          PORT: "8585"
          S3_BUCKET_NAME: "test-bucket"
          S3_REGION: "us-east-1"
          S3_ACCESS_KEY: "fake-access-key"
          S3_SECRET_KEY: "fake-secret-key"
          S3_ENDPOINT: "http://127.0.0.1:19999"
          OTEL_SDK_DISABLED: "true"

      - name: Assert server is healthy
        run: |
          echo "Checking health endpoint at http://127.0.0.1:8585/management/health"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8585/management/health)
          echo "HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "FAIL: expected HTTP 200 from health endpoint, got $HTTP_STATUS"
            exit 1
          fi
          echo "PASS: server is healthy"

      - name: Assert health response body
        run: |
          BODY=$(curl -s http://127.0.0.1:8585/management/health)
          echo "Health response body: $BODY"
          echo "PASS: health endpoint responded"
