name: Test custom port configuration
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start Turbo Cache Server on custom port
        id: action
        uses: .
        continue-on-error: true
        env:
          PORT: "9191"
          HOST: "127.0.0.1"
          S3_BUCKET_NAME: "test-bucket"
          S3_REGION: "us-east-1"
          S3_ACCESS_KEY: "fake-access-key"
          S3_SECRET_KEY: "fake-secret-key"
          S3_ENDPOINT: "http://127.0.0.1:19999"
          S3_USE_PATH_STYLE: "true"
          OTEL_SDK_DISABLED: "true"

      - name: Assert action ran (started or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: server started successfully on custom port 9191"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no real S3 backend available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Verify server is on custom port if started
        if: steps.action.outcome == 'success'
        run: |
          echo "Checking health endpoint at http://127.0.0.1:9191/management/health"
          RESPONSE=$(curl -sf http://127.0.0.1:9191/management/health || echo "FAILED")
          echo "Response: $RESPONSE"
          if [ "$RESPONSE" = "FAILED" ]; then
            echo "FAIL: health endpoint not reachable on custom port 9191"
            exit 1
          fi
          echo "PASS: health endpoint responded on custom port 9191"

      - name: Verify server is NOT on default port
        if: steps.action.outcome == 'success'
        run: |
          echo "Verifying server is NOT on default port 8000"
          RESPONSE=$(curl -sf http://127.0.0.1:8000/management/health || echo "NOT_RUNNING")
          echo "Response on port 8000: $RESPONSE"
          if [ "$RESPONSE" != "NOT_RUNNING" ]; then
            echo "WARN: something is running on port 8000 (unexpected)"
          else
            echo "PASS: server correctly not running on default port 8000"
          fi
