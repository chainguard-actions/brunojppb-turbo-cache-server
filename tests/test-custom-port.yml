name: Test custom port via PORT env var
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start Turbo Cache Server on custom port 9000
        id: start_server
        uses: .
        env:
          PORT: "9000"
          S3_ACCESS_KEY: "fake-access-key"
          S3_SECRET_KEY: "fake-secret-key"
          S3_ENDPOINT: "http://127.0.0.1:19000"
          S3_BUCKET_NAME: "turbo"
          S3_REGION: "eu-central-1"
          S3_USE_PATH_STYLE: "true"

      - name: Assert server is healthy on custom port 9000
        run: |
          echo "Checking server health at http://127.0.0.1:9000/management/health"
          RESPONSE=$(curl -sf http://127.0.0.1:9000/management/health || echo "FAILED")
          echo "Response: $RESPONSE"
          if [ "$RESPONSE" = "FAILED" ]; then
            echo "FAIL: server health check failed on custom port 9000"
            exit 1
          fi
          echo "PASS: server is healthy on custom port 9000"

      - name: Assert server is NOT listening on default port 8000
        run: |
          echo "Verifying server is NOT on default port 8000"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 2 http://127.0.0.1:8000/management/health || echo "0")
          echo "HTTP status on port 8000: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "FAIL: server unexpectedly responded on default port 8000"
            exit 1
          fi
          echo "PASS: server is not on default port 8000 (as expected)"
