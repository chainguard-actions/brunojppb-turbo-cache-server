name: Test custom port configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start Turbo Cache Server on custom port
        id: cache-server
        uses: .
        env:
          HOST: "127.0.0.1"
          PORT: "8585"
          S3_BUCKET_NAME: "test-bucket"
          S3_REGION: "us-east-1"
          S3_ACCESS_KEY: "test-access-key"
          S3_SECRET_KEY: "test-secret-key"
          S3_ENDPOINT: "http://127.0.0.1:9999"
          OTEL_SDK_DISABLED: "true"

      - name: Assert server is running on custom port 8585
        run: |
          echo "Checking health endpoint at http://127.0.0.1:8585/management/health"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://127.0.0.1:8585/management/health || echo "000")
          echo "HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "FAIL: expected HTTP 200 from health endpoint on port 8585, got $HTTP_STATUS"
            exit 1
          fi
          echo "PASS: server is healthy on custom port 8585"

      - name: Assert server is NOT running on default port 8000
        run: |
          echo "Checking that default port 8000 is NOT in use"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 3 http://127.0.0.1:8000/management/health || echo "000")
          echo "HTTP status on port 8000: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "FAIL: expected no server on port 8000, but got HTTP 200"
            exit 1
          fi
          echo "PASS: no server running on default port 8000 (as expected)"
