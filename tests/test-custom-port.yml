name: Test custom port - Turbo Cache Server starts on custom PORT
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start Turbo Cache Server on custom port
        id: action
        uses: .
        continue-on-error: true
        env:
          PORT: "9000"
          S3_ACCESS_KEY: "testkey"
          S3_SECRET_KEY: "testsecret"
          S3_ENDPOINT: "http://127.0.0.1:19000"
          S3_BUCKET_NAME: "turbo-cache-test"
          S3_REGION: "us-east-1"
          S3_USE_PATH_STYLE: "true"

      - name: Assert server is running on custom port 9000
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Checking server health at 127.0.0.1:9000..."
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:9000/management/health)
            echo "HTTP status: $STATUS"
            if [ "$STATUS" != "200" ]; then
              echo "FAIL: Expected HTTP 200 on port 9000 but got $STATUS"
              exit 1
            fi
            echo "PASS: Server is healthy on custom port 9000"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: Action failed gracefully (likely no real S3 backend available in test environment)"
          else
            echo "FAIL: Unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert server is NOT running on default port 8000 (if started)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Verifying server is NOT on default port 8000..."
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 2 http://127.0.0.1:8000/management/health || echo "000")
            echo "HTTP status on port 8000: $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "FAIL: Server unexpectedly responded on default port 8000"
              exit 1
            fi
            echo "PASS: Server is not on default port 8000 (as expected)"
          else
            echo "PASS: Skipping port check since server did not start (no real S3 backend)"
          fi
