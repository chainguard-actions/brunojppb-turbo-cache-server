name: Test custom port
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        env:
          PORT: "8585"
          S3_BUCKET_NAME: test-bucket
          S3_REGION: eu-central-1
          S3_ACCESS_KEY: test-access-key
          S3_SECRET_KEY: test-secret-key
          S3_ENDPOINT: http://127.0.0.1:9
          S3_USE_PATH_STYLE: "true"
      - name: Assert server is healthy on port 8585
        run: |
          code=$(curl -s -o /tmp/health.txt -w '%{http_code}' --max-time 10 http://127.0.0.1:8585/management/health || true)
          echo "status: $code"
          cat /tmp/health.txt || true
          if [ "$code" != "200" ]; then
            echo "FAIL: expected HTTP 200 on port 8585"
            exit 1
          fi
          echo "PASS"
      - name: Assert nothing listening on default port 8000
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:8000/management/health || true)
          echo "status on 8000: $code"
          if [ "$code" = "200" ]; then
            echo "FAIL: server unexpectedly listening on default port 8000"
            exit 1
          fi
          echo "PASS"
