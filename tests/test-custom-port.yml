name: Test custom port
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start Turbo Cache Server on custom port
        id: action
        uses: .
        env:
          PORT: "9191"
          HOST: "127.0.0.1"
          S3_BUCKET_NAME: "test-bucket"
          S3_REGION: "us-east-1"
          S3_ACCESS_KEY: "fake-access-key"
          S3_SECRET_KEY: "fake-secret-key"
          S3_ENDPOINT: "http://127.0.0.1:19999"
          OTEL_SDK_DISABLED: "true"

      - name: Assert server is healthy on custom port 9191
        run: |
          echo "Checking health endpoint at http://127.0.0.1:9191/management/health"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:9191/management/health)
          echo "HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "FAIL: expected HTTP 200 from health endpoint on port 9191, got $HTTP_STATUS"
            exit 1
          fi
          echo "PASS: server is healthy on custom port 9191"

      - name: Assert server is NOT listening on default port 8000
        run: |
          echo "Verifying server is NOT on default port 8000"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 2 http://127.0.0.1:8000/management/health || echo "000")
          echo "HTTP status on port 8000: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "FAIL: server should NOT be listening on port 8000 when PORT=9191"
            exit 1
          fi
          echo "PASS: server is not on default port 8000"
