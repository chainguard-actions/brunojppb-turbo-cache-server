name: Test custom port - server starts on non-default port
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start Turbo Cache Server on custom port
        id: action
        uses: .
        env:
          HOST: "127.0.0.1"
          PORT: "9000"
          S3_ACCESS_KEY: "fakeaccesskey"
          S3_SECRET_KEY: "fakesecretkey"
          S3_ENDPOINT: "http://127.0.0.1:19999"
          S3_BUCKET_NAME: "turbo"
          S3_REGION: "eu-central-1"
          S3_USE_PATH_STYLE: "true"

      - name: Assert server is NOT reachable on default port 8000
        run: |
          echo "Verifying server is NOT on default port 8000"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 2 http://127.0.0.1:8000/management/health || echo "000")
          echo "HTTP status on port 8000: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "FAIL: server should not be listening on port 8000"
            exit 1
          fi
          echo "PASS: server is not on port 8000"

      - name: Assert server is healthy on custom port 9000
        run: |
          echo "Checking health endpoint at http://127.0.0.1:9000/management/health"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:9000/management/health)
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "FAIL: expected HTTP 200 from health endpoint on port 9000, got $STATUS"
            exit 1
          fi
          echo "PASS: server is healthy on custom port 9000"
