name: Test server with authentication token
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start Turbo Cache Server with auth token
        id: action
        uses: .
        continue-on-error: true
        env:
          PORT: "8686"
          HOST: "127.0.0.1"
          TURBO_TOKEN: "secret-test-token"
          S3_BUCKET_NAME: "test-bucket"
          S3_REGION: "us-east-1"
          S3_ACCESS_KEY: "fake-access-key"
          S3_SECRET_KEY: "fake-secret-key"
          S3_ENDPOINT: "http://127.0.0.1:19999"
          S3_USE_PATH_STYLE: "true"
          OTEL_SDK_DISABLED: "true"

      - name: Assert action ran (started or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: server started successfully with auth token"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no real S3 backend available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Verify health endpoint accessible without auth
        if: steps.action.outcome == 'success'
        run: |
          echo "Checking health endpoint (should be accessible without auth)"
          RESPONSE=$(curl -sf http://127.0.0.1:8686/management/health || echo "FAILED")
          echo "Response: $RESPONSE"
          if [ "$RESPONSE" = "FAILED" ]; then
            echo "FAIL: health endpoint not reachable"
            exit 1
          fi
          echo "PASS: health endpoint responded"

      - name: Verify API endpoint rejects requests without auth token
        if: steps.action.outcome == 'success'
        run: |
          echo "Checking that API endpoint requires auth token"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8686/v8/artifacts/status || echo "000")
          echo "HTTP status code without auth: $HTTP_CODE"
          if [ "$HTTP_CODE" = "401" ]; then
            echo "PASS: server correctly rejected unauthenticated request with 401"
          elif [ "$HTTP_CODE" = "000" ]; then
            echo "WARN: could not connect to server"
          else
            echo "INFO: server returned HTTP $HTTP_CODE (may vary by endpoint)"
          fi
