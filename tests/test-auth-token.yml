name: Test TURBO_TOKEN authentication
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        env:
          PORT: "8686"
          TURBO_TOKEN: secret-turbo-token
          S3_BUCKET_NAME: test-bucket
          S3_REGION: eu-central-1
          S3_ACCESS_KEY: test-access-key
          S3_SECRET_KEY: test-secret-key
          S3_ENDPOINT: http://127.0.0.1:9
          S3_USE_PATH_STYLE: "true"
      - name: Assert unauthenticated artifact request is rejected with 401
        run: |
          code=$(curl -s -o /tmp/noauth.txt -w '%{http_code}' --max-time 15 \
            "http://127.0.0.1:8686/v8/artifacts/abc123?teamId=myteam" || true)
          echo "status: $code"
          cat /tmp/noauth.txt || true
          if [ "$code" != "401" ]; then
            echo "FAIL: expected 401 without Authorization header"
            exit 1
          fi
          echo "PASS"
      - name: Assert wrong token is rejected with 401
        run: |
          code=$(curl -s -o /tmp/badauth.txt -w '%{http_code}' --max-time 15 \
            -H "Authorization: Bearer wrong-token" \
            "http://127.0.0.1:8686/v8/artifacts/abc123?teamId=myteam" || true)
          echo "status: $code"
          cat /tmp/badauth.txt || true
          if [ "$code" != "401" ]; then
            echo "FAIL: expected 401 with wrong token"
            exit 1
          fi
          echo "PASS"
      - name: Assert correct token passes authentication
        run: |
          code=$(curl -s -o /tmp/auth.txt -w '%{http_code}' --max-time 30 \
            -H "Authorization: Bearer secret-turbo-token" \
            "http://127.0.0.1:8686/v8/artifacts/abc123?teamId=myteam" || true)
          echo "status: $code"
          cat /tmp/auth.txt || true
          if [ "$code" = "401" ]; then
            echo "FAIL: valid token was rejected"
            exit 1
          fi
          echo "PASS: valid token not rejected by auth (status $code)"
