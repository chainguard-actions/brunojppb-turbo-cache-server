name: Test basic usage (default port)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        env:
          S3_BUCKET_NAME: test-bucket
          S3_REGION: eu-central-1
          S3_ACCESS_KEY: test-access-key
          S3_SECRET_KEY: test-secret-key
          S3_ENDPOINT: http://127.0.0.1:9999
          S3_USE_PATH_STYLE: "true"
      - name: Assert server is healthy on default port 8000
        run: |
          code=$(curl -s -o /tmp/health.txt -w '%{http_code}' http://127.0.0.1:8000/management/health || true)
          echo "status: $code"
          cat /tmp/health.txt || true
          echo
          if [ "$code" != "200" ]; then
            echo "FAIL: expected HTTP 200 from health endpoint"
            exit 1
          fi
          echo "PASS"
      - name: Assert logs directory was created
        run: |
          dir="$(node -e 'console.log(require("path").resolve(require("os").tmpdir(), "decay_logs"))')"
          echo "logs dir: $dir"
          ls -la "$dir" || true
          if [ ! -d "$dir" ]; then
            echo "FAIL: logs directory not found"
            exit 1
          fi
          echo "PASS"
