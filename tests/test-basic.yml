name: Test basic usage - default port
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start Turbo Cache Server (default port 8000)
        id: start_server
        uses: .
        env:
          PORT: "8000"
          S3_ACCESS_KEY: "fake-access-key"
          S3_SECRET_KEY: "fake-secret-key"
          S3_ENDPOINT: "http://127.0.0.1:19000"
          S3_BUCKET_NAME: "turbo"
          S3_REGION: "eu-central-1"
          S3_USE_PATH_STYLE: "true"

      - name: Assert server is healthy on default port
        run: |
          echo "Checking server health at http://127.0.0.1:8000/management/health"
          RESPONSE=$(curl -sf http://127.0.0.1:8000/management/health || echo "FAILED")
          echo "Response: $RESPONSE"
          if [ "$RESPONSE" = "FAILED" ]; then
            echo "FAIL: server health check failed on default port 8000"
            exit 1
          fi
          echo "PASS: server is healthy on default port 8000"

      - name: Assert server responds with HTTP 200 on health endpoint
        run: |
          echo "Checking server responds at http://127.0.0.1:8000/management/health"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/management/health)
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "FAIL: expected HTTP 200 but got $STATUS"
            exit 1
          fi
          echo "PASS: server returned HTTP 200"
