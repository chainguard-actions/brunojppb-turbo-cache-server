name: Test basic usage - start server with defaults
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start MinIO server (binary, no Docker)
        run: |
          # Download MinIO server binary
          curl -sSL https://dl.min.io/server/minio/release/linux-amd64/minio -o /usr/local/bin/minio
          chmod +x /usr/local/bin/minio

          # Start MinIO in background
          mkdir -p /tmp/minio-data
          MINIO_ROOT_USER=minioadmin MINIO_ROOT_PASSWORD=minioadmin \
            /usr/local/bin/minio server /tmp/minio-data \
            --address 127.0.0.1:9000 \
            --console-address 127.0.0.1:9001 \
            > /tmp/minio.log 2>&1 &
          echo "MinIO PID: $!"

          # Wait for MinIO to be ready
          echo "Waiting for MinIO to be ready..."
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/minio/health/live; then
              echo "MinIO is ready"
              break
            fi
            echo "Attempt $i: MinIO not ready yet, waiting..."
            sleep 2
          done
          curl -sf http://127.0.0.1:9000/minio/health/live || (echo "MinIO failed to start" && cat /tmp/minio.log && exit 1)

      - name: Create S3 bucket in MinIO
        run: |
          # Install mc (MinIO client)
          curl -sSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc
          chmod +x /usr/local/bin/mc
          mc alias set local http://127.0.0.1:9000 minioadmin minioadmin
          mc mb local/turbo --ignore-existing
          echo "Bucket created successfully"

      - name: Start Turbo Cache Server
        id: start-server
        uses: .
        env:
          HOST: "127.0.0.1"
          PORT: "8000"
          S3_ACCESS_KEY: "minioadmin"
          S3_SECRET_KEY: "minioadmin"
          S3_ENDPOINT: "http://127.0.0.1:9000"
          S3_BUCKET_NAME: "turbo"
          S3_REGION: "us-east-1"
          S3_USE_PATH_STYLE: "true"
          OTEL_SDK_DISABLED: "true"

      - name: Assert server is healthy
        run: |
          echo "Checking server health at http://127.0.0.1:8000/management/health"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/management/health || echo "000")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "FAIL: expected HTTP 200 from health endpoint, got $STATUS"
            exit 1
          fi
          echo "PASS: server is healthy"

      - name: Assert server responds to cache API
        run: |
          echo "Checking server root endpoint"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/ || echo "000")
          echo "HTTP status: $STATUS"
          # Server should respond (any non-connection-refused response is acceptable)
          if [ "$STATUS" = "000" ]; then
            echo "FAIL: server is not responding at all"
            exit 1
          fi
          echo "PASS: server responded with status $STATUS"
