name: Test Turborepo cache API endpoint
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PORT: "8686"
      HOST: "127.0.0.1"
      S3_BUCKET_NAME: "test-bucket"
      S3_REGION: "us-east-1"
      # Fake credentials so the server doesn't panic trying to load default AWS creds
      S3_ACCESS_KEY: "fakeaccesskey"
      S3_SECRET_KEY: "fakesecretkey"
      # Point to a local non-existent endpoint so S3 ops fail fast (not real AWS)
      S3_ENDPOINT: "http://127.0.0.1:19999"
      S3_USE_PATH_STYLE: "true"
      OTEL_SDK_DISABLED: "true"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start Turbo Cache Server
        id: cache-server
        uses: .

      - name: Assert health endpoint responds with 200
        run: |
          echo "Checking health endpoint at http://127.0.0.1:8686/management/health"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8686/management/health || echo "000")
          echo "HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "FAIL: expected HTTP 200 from health endpoint, got $HTTP_STATUS"
            exit 1
          fi
          echo "PASS: health endpoint returns 200"

      - name: Assert artifacts API endpoint is reachable
        run: |
          # The Turborepo remote cache API endpoint for artifacts
          # Without valid S3 credentials, we expect a non-connection-error response
          # (could be 404, 500, etc. but NOT a connection refused)
          echo "Checking artifacts API endpoint at http://127.0.0.1:8686/v8/artifacts/nonexistent-hash"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer test-token" \
            http://127.0.0.1:8686/v8/artifacts/nonexistent-hash || echo "000")
          echo "HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "000" ]; then
            echo "FAIL: could not connect to artifacts API endpoint (connection refused)"
            exit 1
          fi
          echo "PASS: artifacts API endpoint is reachable (status: $HTTP_STATUS)"
