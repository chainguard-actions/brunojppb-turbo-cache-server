name: Test default port
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start Turbo Cache Server on default port
        id: cache-server
        uses: .
        continue-on-error: true
        env:
          # No PORT set — should default to 8000
          S3_BUCKET_NAME: "test-bucket"
          S3_REGION: "eu-central-1"
          S3_ACCESS_KEY: "fake-access-key"
          S3_SECRET_KEY: "fake-secret-key"
          S3_ENDPOINT: "http://127.0.0.1:9999"
          S3_USE_PATH_STYLE: "true"

      - name: Assert server started or failed gracefully on default port
        env:
          OUTCOME: ${{ steps.cache-server.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: Turbo Cache Server started on default port 8000"
            # Verify the server is responding on the default port
            if curl -sf http://127.0.0.1:8000/management/health; then
              echo "PASS: Health check endpoint is responding on port 8000"
            else
              echo "INFO: Server started but health endpoint not reachable on port 8000"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: Server failed to start gracefully (expected without valid S3 backend)"
          else
            echo "FAIL: Unexpected outcome '$OUTCOME'"
            exit 1
          fi
