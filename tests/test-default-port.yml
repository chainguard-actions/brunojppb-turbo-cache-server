name: Test default port and no-auth mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start Turbo Cache Server with default port (no auth)
        id: action
        uses: .
        continue-on-error: true
        env:
          # Use default PORT (8000) by not setting PORT
          S3_BUCKET_NAME: "test-bucket"
          S3_REGION: "us-east-1"
          S3_ACCESS_KEY: "fake-access-key"
          S3_SECRET_KEY: "fake-secret-key"
          S3_ENDPOINT: "http://127.0.0.1:19999"
          # No TURBO_TOKEN set — server runs without authentication
          OTEL_SDK_DISABLED: "true"

      - name: Assert server started on default port or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: server started successfully on default port 8000"
            # Verify health endpoint is reachable on the default port
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/management/health || echo "000")
            echo "health endpoint status on port 8000: $HTTP_STATUS"
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "PASS: health endpoint returned 200 on default port"
            else
              echo "INFO: health endpoint returned $HTTP_STATUS"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected when S3 is not available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
