name: Test default port 8000
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        env:
          S3_BUCKET_NAME: test-bucket
          S3_ACCESS_KEY: test-access-key
          S3_SECRET_KEY: test-secret-key
          S3_ENDPOINT: http://127.0.0.1:9000
      - name: Assert server is healthy on default port 8000
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/management/health || true)
          echo "http code: $code"
          if [ "$code" != "200" ]; then
            echo "FAIL: expected 200 from health endpoint on port 8000"
            exit 1
          fi
          echo "PASS"
